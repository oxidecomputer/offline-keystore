name: formatting
on: [push, pull_request]
permissions:
  contents: read

jobs:
  format:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt
          toolchain: 1.91
      - run: cargo fmt --check
