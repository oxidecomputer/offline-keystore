[package]
name = "oks"
version = "0.3.3"
description = """
A utility for managing and interacting with the offline keystore.
"""
edition = "2021"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive", "env"] }
const_format = "0.2.36"
env_logger = "0.11.10"
fs_extra = "1.3.0"
hex = { version = "0.4.3", features = ["serde"] }
log = "0.4.29"
lpc55_sign = { git = "https://github.com/oxidecomputer/lpc55_support", default-features = false, version = "0.3.4" }
lpc55_areas = { git = "https://github.com/oxidecomputer/lpc55_support", default-features = false, version = "0.2.4" }
num-bigint = "0.4.6"
p256 = "0.13"
pem-rfc7468 = { version = "1.0.0", features = ["alloc", "std"] }
rand = "0.9.0"
rand_core = { version = "0.6.4", features = ["std"] }
rpassword = "7.4.0"
serde = "1.0.228"
serde_json = "1.0.149"
serde_with = "3.18.0"
static_assertions = "1.1.0"
tempfile = "3.27.0"
textwrap = "0.16.2"
thiserror = "2.0.18"
vsss-rs = "5.3.0"
x509-cert = "0.2.5"
yubihsm = { git = "https://github.com/oxidecomputer/yubihsm.rs", branch = "session-close", features = ["usb", "untested"] }
zeroize = "1.8.2"
zeroize_derive = "1.4.3"
glob = "0.3.3"
rsa = "0.9.10"
sha2 = "0.11.0"
zerocopy = { version = "0.8.48", features = ["derive", "std", "zerocopy-derive"] }
